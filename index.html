<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Casaca</title>
<meta name="description" content="La app del plantel: convocatoria, pizarra, estadísticas y la carta de cada jugador.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Casaca">
<meta property="og:title" content="La Casaca · la app del equipo">
<meta property="og:description" content="Convocatoria, pizarra, estadísticas, torneo y entrenamientos. Para el plantel y el DT.">
<meta property="og:image" content="https://lacasacadt.vercel.app/icons/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#EEF5EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1611" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Casaca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Cancha de día: blanco cal, verde césped, casaca amarilla. De noche: césped bajo los reflectores. */
:root{
  --bg:#EEF5EC; --card:#FFFFFF; --ink:#10231A; --muted:#5A6E62; --line:#D6E5D8;
  --grass:#14964A; --grass-dark:#0D7038; --grass-soft:#DCF2E2; --grass-ink:#0B5A2C;
  --bib:#D8F23A; --bib-ink:#3E4A00;
  --gold:#E9A800; --gold-soft:#FFF1C2; --gold-ink:#7A5200;
  --coral:#F0533E; --coral-dark:#C43A28; --coral-soft:#FFE3DD; --coral-ink:#8F2414;
  --sky:#2E7FD9; --sky-soft:#E0EEFB; --sky-ink:#174E8C;
  --field:#FFFFFF; --nav:rgba(255,255,255,.95); --scrim:rgba(10,30,20,.5); --toast:#10231A; --toast-ink:#FFFFFF;
  --pitch1:#1E9A50; --pitch2:#23A658; --chalk:rgba(255,255,255,.85);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --f-body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Big Shoulders Display","Bricolage Grotesque",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1611; --card:#12221A; --ink:#E8F3EC; --muted:#9BB3A5; --line:#22392C;
    --grass:#2DB866; --grass-dark:#178A47; --grass-soft:#143524; --grass-ink:#8FE3B1;
    --bib-ink:#E5F77A;
    --gold-soft:#3A2E08; --gold-ink:#FFD45C;
    --coral-soft:#3D1A14; --coral-ink:#FFA597;
    --sky-soft:#13263A; --sky-ink:#8CC2F7;
    --field:#0F1D16; --nav:rgba(11,22,17,.94); --scrim:rgba(0,0,0,.6); --toast:#E8F3EC; --toast-ink:#0B1611;
    --pitch1:#156F3A; --pitch2:#187A40; --chalk:rgba(255,255,255,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
::selection{background:var(--grass);color:#fff}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.section{margin-top:24px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.section-title h2{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(100px + var(--safe-b))}

/* Barra de arriba: selector de equipo + perfil */
.status{position:sticky;top:0;z-index:25;background:var(--nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:var(--safe-t);border-bottom:2px solid var(--line)}
.status .inner{max-width:520px;margin:0 auto;padding:8px 12px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.teamsel{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;padding:6px 10px 6px 4px;border-radius:14px;min-width:0}
.teamsel:active{background:var(--line)}
.teamsel .em{font-size:26px;line-height:1}
.teamsel .chev{color:var(--muted);font-size:14px}
.teamsel .role{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--grass-ink);background:var(--grass-soft);padding:2px 7px;border-radius:999px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;flex:none;text-transform:uppercase}
.av.lg{width:56px;height:56px;font-size:21px}

/* Botones gorditos, como en Fueguitos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:17px;background:var(--grass);color:#fff;box-shadow:0 4px 0 var(--grass-dark);width:100%;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--grass-dark)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-dark)}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 #1C5EA8}
.btn.bib{background:var(--bib);color:#2A3300;box-shadow:0 4px 0 #A9C21B}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px;width:auto;box-shadow:0 3px 0 var(--grass-dark)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}
.btn.sm:active{transform:translateY(3px)}
.link{color:var(--sky);font-weight:700;font-size:15px}
.link.muted{color:var(--muted)}
.link.danger{color:var(--coral)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}

.card{background:var(--card);border-radius:20px;padding:16px;border:2px solid var(--line)}
.card.tap{display:block;width:100%;text-align:left}
.card.tap:active{background:var(--grass-soft)}
.field{display:block}
.field>span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.input{width:100%;min-height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:var(--field);font-size:17px}
.input:focus{border-color:var(--grass);outline:none}
textarea.input{padding:12px 14px;min-height:80px;resize:vertical}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--grass-soft);color:var(--grass-ink)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.coral{background:var(--coral-soft);color:var(--coral-ink)}
.pill.sky{background:var(--sky-soft);color:var(--sky-ink)}
.banner{border-radius:16px;padding:12px 14px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
.banner.gold{background:var(--gold-soft);color:var(--gold-ink)}
.banner.sky{background:var(--sky-soft);color:var(--sky-ink)}
.banner.coral{background:var(--coral-soft);color:var(--coral-ink)}
.banner.ok{background:var(--grass-soft);color:var(--grass-ink)}

/* Elegir entre opciones */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--line);padding:4px;border-radius:16px}
.seg button{min-height:44px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;white-space:nowrap}
.chip.on{border-color:var(--grass);background:var(--grass-soft);color:var(--grass-ink)}

/* Stepper */
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:800;display:grid;place-items:center}
.stepper button:active{background:var(--grass-soft)}
.stepper output{min-width:44px;text-align:center;font-size:24px;font-weight:800;font-family:var(--f-num)}
.statrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.statrow:last-child{border-bottom:0}
.statrow b{font-size:17px}

/* Voy / Duda / No voy */
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsvp button{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;gap:2px}
.rsvp button span{font-size:20px}
.rsvp button.on.voy{background:var(--grass);border-color:var(--grass);color:#fff}
.rsvp button.on.duda{background:var(--gold);border-color:var(--gold);color:#3A2800}
.rsvp button.on.no_voy{background:var(--coral);border-color:var(--coral);color:#fff}

/* Partido */
.match{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.mdate{width:52px;height:56px;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mdate b{font-family:var(--f-num);font-size:24px}
.mdate small{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-top:2px}
.mres{font-family:var(--f-num);font-size:26px;font-weight:900;letter-spacing:.02em;text-align:right;line-height:1}
.wdl{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:800;font-size:13px;color:#fff}
.wdl.G{background:var(--grass)}.wdl.E{background:var(--gold);color:#3A2800}.wdl.P{background:var(--coral)}.wdl.N{background:var(--line);color:var(--muted)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.stars i{font-style:normal;color:var(--line)}
.scoreboard{background:linear-gradient(160deg,#0F3A22,#0B2417);color:#fff;border-radius:22px;padding:18px 16px;text-align:center;position:relative;overflow:hidden}
.scoreboard::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border:3px solid rgba(255,255,255,.08);border-radius:50%}
.scoreboard .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:8px}
.scoreboard .tn{font-weight:800;font-size:17px;line-height:1.15}
.scoreboard .sc{font-family:var(--f-num);font-size:54px;font-weight:900;line-height:1;letter-spacing:.04em}
.scoreboard .meta{font-size:13px;opacity:.8;font-weight:600}
.hero{background:linear-gradient(160deg,var(--grass),var(--grass-dark));color:#fff;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero h2{font-size:26px;margin-top:4px}
.hero .meta{font-size:15px;opacity:.9;margin-top:4px;font-weight:600}
.hero .rsvp button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .rsvp button.on.voy{background:#fff;color:var(--grass-dark);border-color:#fff}
.hero .count{font-size:14px;font-weight:700;margin-top:10px;opacity:.95}

/* Cartas de jugador */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{--c1:#C9D3CC;--c2:#9AA9A0;--ink:#1D2A22;position:relative;aspect-ratio:3/4;border-radius:18px 18px 18px 18px;background:linear-gradient(155deg,var(--c1),var(--c2));color:var(--ink);padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;width:100%;clip-path:polygon(0 0,82% 0,100% 12%,100% 100%,0 100%)}
.pc::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.10) 0 10px,transparent 10px 22px);pointer-events:none}
.pc.bronce{--c1:#E6B98C;--c2:#B57B45;--ink:#3A2210}
.pc.plata{--c1:#E9EEF1;--c2:#A9B6BF;--ink:#1E2A33}
.pc.oro{--c1:#FCE38A;--c2:#D9A520;--ink:#3B2A00}
.pc.elite{--c1:#1A5C35;--c2:#0B2A18;--ink:#F4F9D2}
.pc.elite .pc-ov{color:var(--bib)}
.pc.out{filter:grayscale(.75);opacity:.75}
.pc-top{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;align-items:center;line-height:.9;z-index:1}
.pc-ov{font-family:var(--f-num);font-weight:900;font-size:36px}
.pc-pos{font-weight:800;font-size:12px;letter-spacing:.06em}
.pc-st{position:absolute;right:10px;top:26px;font-size:16px;z-index:1}
.pc-face{margin-top:20px;width:58%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:34px;position:relative;z-index:1}
.pc-name{margin-top:auto;font-weight:800;font-size:17px;line-height:1.1;max-width:100%;position:relative;z-index:1;text-transform:uppercase;letter-spacing:.02em}
.pc-sub{font-size:12px;font-weight:700;opacity:.8;position:relative;z-index:1;margin-top:2px}
.pc.big{max-width:280px;margin:0 auto}
.pc.big .pc-ov{font-size:58px}
.pc.big .pc-pos{font-size:15px}
.pc.big .pc-face{width:46%;font-size:46px;margin-top:26px}
.pc.big .pc-name{font-size:24px;margin-top:10px}
.pc-attrs{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-top:10px;font-weight:800;font-size:15px;position:relative;z-index:1}
.pc-attrs span{display:flex;gap:6px;justify-content:space-between}
.pc-attrs b{font-family:var(--f-num);font-size:18px}
.pc.big{aspect-ratio:auto;padding-bottom:16px}

/* Listas */
.list{display:grid;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card);width:100%;text-align:left}
.lrow:active{background:var(--grass-soft)}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t small{color:var(--muted);font-weight:600;font-size:13px}
.rate{font-family:var(--f-num);font-weight:900;font-size:22px;min-width:40px;text-align:center;border-radius:10px;padding:2px 6px}
.r-hi{background:var(--grass);color:#fff}.r-ok{background:var(--grass-soft);color:var(--grass-ink)}.r-mid{background:var(--gold-soft);color:var(--gold-ink)}.r-lo{background:var(--coral-soft);color:var(--coral-ink)}.r-na{background:var(--bg);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpis div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.kpis b{display:block;font-family:var(--f-num);font-size:28px;font-weight:900;line-height:1}
.kpis span{font-size:12px;font-weight:700;color:var(--muted)}

/* Planilla tipo Excel */
.sheetwrap{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--card)}
table.pl{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
table.pl th,table.pl td{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.pl th{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:var(--card);position:sticky;top:0}
table.pl th.l,table.pl td.l{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;border-right:2px solid var(--line);max-width:120px;overflow:hidden;text-overflow:ellipsis}
table.pl th.sort{cursor:pointer}
table.pl th.sort.on{color:var(--grass-ink)}
table.pl td .cell{display:inline-block;min-width:32px;border-radius:8px;padding:2px 4px;font-family:var(--f-num);font-weight:800;font-size:16px}
table.pl tr:last-child td{border-bottom:0}
table.pl.tight th,table.pl.tight td{padding:7px 5px}
table.pl.tight th.l,table.pl.tight td.l{max-width:130px}
table.pl td.me{font-weight:800}

/* Pizarra */
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch1) 0 10%,var(--pitch2) 10% 20%);touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;touch-action:none;z-index:2}
.tok .dot{width:44px;height:44px;border-radius:50%;background:var(--bib);color:#2A3300;display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25);border:3px solid #fff}
.tok.gk .dot{background:#FFB020}
.tok.empty .dot{background:rgba(255,255,255,.18);border:3px dashed rgba(255,255,255,.8);color:#fff;box-shadow:none}
.tok.hurt .dot{background:var(--coral);color:#fff}
.tok .nm{font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok.drag{z-index:5}
.mc{--c1:#E3EAE5;--c2:#A9B8AE;--ink:#1D2A22;position:relative;width:64px;height:72px;border-radius:9px;background:linear-gradient(155deg,var(--c1),var(--c2));color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.9);overflow:hidden}
.mc::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.12) 0 6px,transparent 6px 13px)}
.mc.bronce{--c1:#E6B98C;--c2:#B57B45;--ink:#3A2210}.mc.plata{--c1:#F1F4F6;--c2:#A9B6BF;--ink:#1E2A33}.mc.oro{--c1:#FCE38A;--c2:#D9A520;--ink:#3B2A00}.mc.elite{--c1:#1A5C35;--c2:#0B2A18;--ink:#F4F9D2}
.mc-top{position:relative;display:flex;align-items:baseline;gap:3px;padding:3px 4px 0}
.mc-ov{font-family:var(--f-num);font-weight:900;font-size:19px;line-height:1}.mc.elite .mc-ov{color:var(--bib)}
.mc-pos{font-weight:800;font-size:8px;letter-spacing:.04em}
.mc-at{position:absolute;left:3px;right:3px;bottom:3px;display:grid;grid-template-columns:1fr 1fr;gap:1px 4px}

/* ============ Cálculos ============ */
function votingOpen(x){ return x.played && x.result_at && (Date.now() - new Date(x.result_at).getTime()) < 48*36e5; }
function mvpOf(x){
  const vs = S.T.votes.filter(v => v.match_id === x.id);
  if (!vs.length || votingOpen(x)) return [];
  const c = {}; vs.forEach(v => c[v.voted_id] = (c[v.voted_id] || 0) + 1);
  const max = Math.max(...Object.values(c));
  return Object.keys(c).filter(k => c[k] === max);
}
function wdl(x){
  if (!x.played) return null;
  if (x.goals_for == null || x.goals_against == null) return 'N';
  return x.goals_for > x.goals_against ? 'G' : x.goals_for < x.goals_against ? 'P' : 'E';
}
const playedMatches = () => S.T.matches.filter(x => x.played);
function nextMatch(){
  const now = Date.now() - 3*36e5;
  const up = S.T.matches.filter(x => !x.played && (!x.starts_at || new Date(x.starts_at).getTime() > now));
  up.sort((a,b) => (a.starts_at ? new Date(a.starts_at) : Infinity) - (b.starts_at ? new Date(b.starts_at) : Infinity));
  return up[0] || null;
}
function agg(mid){
  const played = new Set(playedMatches().map(x => x.id));
  const rows = S.T.stats.filter(s => s.member_id === mid && s.played && played.has(s.match_id));
  const rs = rows.map(s => s.dt_rating).filter(r => r != null).map(Number);
  const figs = playedMatches().filter(x => mvpOf(x).includes(mid)).length;
  const tc = trainCompliance(mid);
  return {
    pj: rows.length,
    goals: rows.reduce((a,s) => a + s.goals, 0),
    assists: rows.reduce((a,s) => a + s.assists, 0),
    yellow: rows.reduce((a,s) => a + s.yellow, 0),
    red: rows.filter(s => s.red).length,
    avg: rs.length ? rs.reduce((a,b) => a+b, 0) / rs.length : null,
    rated: rs.length, figs,
    att: played.size ? rows.length / played.size : null,
    tdone: tc.done, tcount: tc.count, ent: tc.count ? Math.round(tc.done / tc.count * 100) : null
  };
}
// Puntaje sugerido (1–100) a partir de lo que pasó en la cancha. El DT decide si lo usa.
function suggested(mid){
  const a = agg(mid);
  if (a.rated < 2) return null;
  let v = 40 + a.avg * 5;
  v += Math.min(6, (a.goals / a.pj) * 6);
  v += Math.min(4, (a.assists / a.pj) * 5);
  if (a.att != null) v += Math.max(-5, Math.min(5, (a.att - .6) * 12));
  v += Math.min(3, a.figs);
  return Math.max(1, Math.min(99, Math.round(v)));
}

  if (!list.length) return '';
  return `<span class="form${big ? ' big' : ''}">${list.map(r => `<i class="fd ${r.r}" title="${esc(r.t || '')}">${r.r}</i>`).join('')}</span>`;

function openSheet(html, onClose){

  sheet._onClose = onClose;
  return sheet;
}
function closeSheet(){

function bindSteppers(root, limits = {}){

/* ============ Cambios sugeridos ============ */
// Con las posiciones de cada uno (la principal y las que también juega), su carta y si confirmó, la app propone quién entra por quién.
const POS_GROUP = { ARQ: 0, DEF: 1, LAT: 1, VOL: 2, ENG: 2, EXT: 3, DEL: 3 };
function slotPos(s){ const m = s.m && member(s.m); if (m && (m.positions || [])[0]) return m.positions[0]; if (s.gk) return 'ARQ'; return s.y > 58 ? 'DEF' : s.y > 30 ? 'VOL' : 'DEL'; }
function posFit(m, pos){
  const ps = m.positions || [];
  if (!ps.length) return pos === 'ARQ' ? 0 : 0.8;
  if (ps[0] === pos) return 3;
  if (ps.includes(pos)) return 2.5;
  if (pos === 'ARQ' || ps[0] === 'ARQ') return 0;
  const d = Math.min(...ps.filter(p => POS_GROUP[p] != null).map(p => Math.abs(POS_GROUP[p] - POS_GROUP[pos])));
  return d === 0 ? 1.6 : d === 1 ? 0.6 : 0;
}
function subOptions(slot, bench, map){
  const pos = slotPos(slot);
  return bench.map(m => ({ m, fit: posFit(m, pos), conf: map ? ({ voy: 1, duda: 0.4 }[map[m.id]] ?? 0) : 1 }))
    .filter(o => o.fit > 0).map(o => ({ ...o, score: o.fit * 10 + (o.m.overall ?? 60) / 10 + o.conf * 4 })).sort((a,b) => b.score - a.score);
}
function subsPlan(map){
  const on = new Set(PZ.slots.map(s => s.m).filter(Boolean));
  let bench = [...players(), ...guests()].filter(m => !on.has(m.id) && m.status === 'ok' && (!map || map[m.id] !== 'no_voy'));
  const urgent = [], perSlot = [];
  PZ.slots.forEach((s, i) => {
    const m = s.m && member(s.m);
    const why = !m ? 'Lugar vacío' : m.status !== 'ok' ? STATUS[m.status][1] : map && map[m.id] === 'no_voy' ? 'No va' : null;
    const opts = subOptions(s, bench, map);
    if (why && opts[0]){ urgent.push({ i, m, why, pos: slotPos(s), o: opts[0] }); bench = bench.filter(b => b.id !== opts[0].m.id); }
    else if (m && !why) perSlot.push({ i, m, pos: slotPos(s), opts });
  });
  perSlot.forEach(x => x.opts = x.opts.filter(o => bench.includes(o.m)).slice(0, 2));
  return { urgent, perSlot: perSlot.filter(x => x.opts.length) };
}
const posTxt = (m) => (m.positions || []).join('/') || 'sin posición';
const confTxt = (map, id) => !map ? '' : { voy: ' · confirmó ✅', duda: ' · duda 🤔', no_voy: ' · no va' }[map[id]] || ' · no respondió';

function bindPitchDrag(){
  const pitch = $('#pitch');
  $$('.tok', pitch).forEach(t => {
    let sx, sy, moved = false, id = null;
    t.addEventListener('pointerdown', (e) => { id = e.pointerId; t.setPointerCapture(id); sx = e.clientX; sy = e.clientY; moved = false; });
    t.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
      moved = true; t.classList.add('drag');
      const r = pitch.getBoundingClientRect();
      const x = Math.max(4, Math.min(96, (e.clientX - r.left) / r.width * 100)), y = Math.max(3, Math.min(97, (e.clientY - r.top) / r.height * 100));
      t.style.left = x + '%'; t.style.top = y + '%';
      const s = PZ.slots[+t.dataset.i]; s.x = Math.round(x*10)/10; s.y = Math.round(y*10)/10;
    });
    t.addEventListener('pointerup', (e) => {
      if (e.pointerId !== id) return; id = null; t.classList.remove('drag');
      if (moved){ PZ.dirty = true; const b = $('#pz-save'); if (b) b.disabled = false; if (PZ.mode === 'sug') renderPizarra(); }
      else slotSheet(+t.dataset.i);
    });
    t.addEventListener('pointercancel', () => { id = null; t.classList.remove('drag'); });
  });
}

    if (at >= 0 && at !== i) PZ.slots[at].m = s.m; // intercambio
    s.m = id; PZ.dirty = true; closeSheet(); renderPizarra();
  });
  const x = $('#sl-x', el); if (x) x.onclick = () => { s.m = null; PZ.dirty = true; closeSheet(); renderPizarra(); };
  const ns = $('#sl-ns', el); if (ns) ns.onclick = () => { const v = $('#sl-n', el).value.trim(); if (v) PZ.notes[cur.id] = v; else delete PZ.notes[cur.id]; PZ.dirty = true; closeSheet(); renderPizarra(); toast('Indicación guardada. Acordate de guardar el equipo.'); };
}
async function savePizarra(){

// Imagen de la formación para mandar al grupo.
async function sharePizarra(){
  const W = 1080, pad = 70, fw = W - pad*2, fh = Math.round(fw * 100 / 68), H = fh + 300;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#0B2417'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#fff'; g.font = '900 64px "Big Shoulders Display", sans-serif'; g.textAlign = 'center';
  g.fillText(`${S.T.team.name.toUpperCase()} · ${PZ.formation}`, W/2, 110);
  g.font = '600 34px "Bricolage Grotesque", sans-serif'; g.fillStyle = 'rgba(255,255,255,.75)';
  const nx = nextMatch(); g.fillText(nx ? `vs ${nx.opponent} · ${fmtWhen(nx.starts_at)}` : PZ.name, W/2, 165);
  const top = 220;
  for (let i = 0; i < 10; i++){ g.fillStyle = i % 2 ? '#23A658' : '#1E9A50'; g.fillRect(pad, top + i*fh/10, fw, fh/10 + 1); }
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 5;
  const X = (x) => pad + x/68*fw, Y = (y) => top + y/100*fh;
  g.strokeRect(X(2.5), Y(2.5), X(65.5)-X(2.5), Y(97.5)-Y(2.5));
  g.beginPath(); g.moveTo(X(2.5), Y(50)); g.lineTo(X(65.5), Y(50)); g.stroke();
  g.beginPath(); g.arc(X(34), Y(50), 8.2/68*fw, 0, Math.PI*2); g.stroke();
  [[15,2.5,38,15.5],[24.5,2.5,19,5.5],[15,82,38,15.5],[24.5,92,19,5.5]].forEach(([x,y,w,h]) => g.strokeRect(X(x), Y(y), w/68*fw, h/100*fh));
  PZ.slots.forEach(s => {
    const m = s.m && member(s.m), cx = pad + s.x/100*fw, cy = top + s.y/100*fh;
    g.beginPath(); g.arc(cx, cy, 46, 0, Math.PI*2); g.fillStyle = !m ? 'rgba(255,255,255,.2)' : s.gk ? '#FFB020' : '#D8F23A'; g.fill();
    g.lineWidth = 6; g.strokeStyle = '#fff'; g.stroke();
    g.fillStyle = '#2A3300'; g.font = '900 44px "Big Shoulders Display", sans-serif'; g.textBaseline = 'middle';
    g.fillText(m ? String(m.number ?? initials(m.name)).toUpperCase() : '', cx, cy + 2);
    if (m){
      g.font = '800 30px "Bricolage Grotesque", sans-serif'; const w = g.measureText(m.name).width + 24;
      g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect(cx - w/2, cy + 54, w, 42, 10); g.fill();
      g.fillStyle = '#fff'; g.fillText(m.name, cx, cy + 76);
    }
    g.textBaseline = 'alphabetic';
  });
  g.fillStyle = 'rgba(255,255,255,.55)'; g.font = '600 28px "Bricolage Grotesque", sans-serif'; g.fillText('Armado en La Casaca', W/2, H - 40);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const file = new File([blob], `pizarra-${PZ.formation}.png`, { type: 'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: S.T.team.name }); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  toast('Imagen descargada. Mandala al grupo.');
}

// Plan semanal: una rutina por día; cada día le llega al equipo como entrenamiento con fecha límite ese día.

  const monday = (offset) => { const d = new Date(); d.setHours(12,0,0,0); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k + offset * 7); return d; };

  const el = openSheet(`<h2>Plan de la semana</h2><p class="muted">Elegí una semana tipo y ajustá lo que quieras. Cada día le llega al equipo con su rutina, series y video.</p>

    <div class="field section"><span>¿Obligatorio?</span><div class="seg" id="wp-m"><button type="button" data-v="1" class="on">Sí, para todos</button><button type="button" data-v="0">Opcional</button></div></div>
    <div class="field section"><span>¿Foto de prueba?</span><div class="seg" id="wp-p"><button type="button" data-v="1" class="on">📸 Sí</button><button type="button" data-v="0">No hace falta</button></div></div>
    <button class="btn section" id="wp-ok">Mandar la semana</button>`);
  const opts = (sel) => `<option value="">😴 Descanso</option>${Object.entries(PLACES).map(([k,l]) => `<optgroup label="${l}">${allRoutines().filter(r => (r.place || 'casa') === k).map(r => `<option value="${r.id}" ${sel === r.id ? 'selected' : ''}>${r.emoji} ${esc(r.name)}</option>`).join('')}</optgroup>`).join('')}`;
  const draw = () => {
    $$('#wp-w button', el).forEach(b => b.classList.toggle('on', +b.dataset.w === week));
    const m0 = monday(week), today = new Date(); today.setHours(0,0,0,0);
    $('#wp-d', el).innerHTML = DN.map((n, i) => {
      const d = new Date(m0); d.setDate(m0.getDate() + i);
      const past = d < today;
      const match = S.T.matches.find(x => x.starts_at && ymd(new Date(x.starts_at)) === ymd(d));
      return `<div class="dtrow"><span class="who"><span style="min-width:0"><b style="display:block">${n} ${d.getDate()}</b><span class="mini">${match ? `⚽ vs ${esc(match.opponent)}` : past ? 'Ya pasó' : ''}</span></span></span>
        ${match ? '<span class="pill ok">Partido</span>' : `<select class="input" data-i="${i}" style="min-height:42px;font-size:15px;max-width:200px" ${past ? 'disabled' : ''}>${opts(plan[i])}</select>`}</div>`;
    }).join('');
    $$('#wp-d select', el).forEach(s => s.onchange = () => { plan[+s.dataset.i] = s.value; });
  };
  $$('#wp-w button', el).forEach(b => b.onclick = () => { week = +b.dataset.w; draw(); });
  $$('#wp-t [data-t]', el).forEach(b => b.onclick = () => { const w = WEEK_TEMPLATES.find(x => x.id === b.dataset.t); plan = {}; Object.entries(w.days).forEach(([d, r]) => { if (r !== 'PARTIDO') plan[+d - 1] = r; }); $$('#wp-t [data-t]', el).forEach(x => x.style.borderColor = x === b ? 'var(--grass)' : ''); draw(); });
  $$('#wp-m button', el).forEach(b => b.onclick = () => { mand = b.dataset.v === '1'; $$('#wp-m button', el).forEach(x => x.classList.toggle('on', x === b)); });
  $$('#wp-p button', el).forEach(b => b.onclick = () => { proof = b.dataset.v === '1'; $$('#wp-p button', el).forEach(x => x.classList.toggle('on', x === b)); });

  $('#wp-ok', el).onclick = async () => {

// Modo entrenar: ejercicio por ejercicio, serie por serie, con el descanso cronometrado.
const mmss = (n) => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
const restSecs = (s) => { s = String(s || ''); let m = s.match(/(\d+)(?:\s*-\s*\d+)?\s*min/); if (m) return +m[1] * 60; m = s.match(/(\d+)\s*s\b/); return m ? +m[1] : 0; };
function workout(t){
  const items = (t.plan && t.plan.items) || []; if (!items.length) return;
  const st = { i: 0, done: items.map(it => Array(Math.max(1, +it.s || 1)).fill(false)), kg: items.map(() => ''), t0: Date.now(), timer: null, left: 0 };
  const layer = $('#layer');
  if (!layerInHistory){ history.pushState({ layer: 1 }, ''); layerInHistory = true; }
  const close = () => { clearInterval(st.timer); closeSheet(); };
  const draw = () => {
    const it = items[st.i], sets = st.done[st.i], next = sets.findIndex(x => !x), total = items.length;
    const pct = Math.round(st.done.flat().filter(Boolean).length / st.done.flat().length * 100);
    layer.innerHTML = `<div class="wk" role="dialog" aria-modal="true" aria-label="Entrenando">
      <div class="row between"><button class="link muted" id="wk-x">✕ Salir</button><span class="mini">${st.i + 1} de ${total}</span></div>
      <span class="bar" style="margin:10px 0 18px"><i style="width:${pct}%"></i></span>
      ${it.b ? `<div class="mini" style="text-transform:uppercase;letter-spacing:.06em">${esc(it.b)}</div>` : ''}
      <h1 style="margin:4px 0 6px">${esc(it.n)}</h1>
      <p style="font-size:20px;font-weight:800;color:var(--grass-ink)">${esc(it.s && it.r ? `${it.r}${/s$|min/.test(it.r) ? '' : ' repeticiones'}` : doseOf(it))}</p>
      ${it.load ? `<p class="small" style="margin-top:4px"><b>Carga:</b> ${esc(it.load)}</p>` : ''}
      ${it.t ? `<p class="small muted" style="margin-top:6px">${esc(it.t)}</p>` : ''}
      ${it.q ? `<a class="btn ghost sm" style="margin-top:10px;text-decoration:none;box-shadow:none" href="${ytLink(it.q)}" target="_blank" rel="noopener">▶ Ver cómo se hace</a>` : ''}
      <div class="sets">${sets.map((d, k) => `<button class="set ${d ? 'on' : ''}" data-k="${k}"><b>${d ? '✓' : k + 1}</b><span>Serie ${k + 1}</span></button>`).join('')}</div>
      ${/kg|carga|peso|sobran/i.test((it.load || '') + it.n) || t.plan.place === 'gimnasio' ? `<label class="field" style="margin-top:12px"><span>Peso que usaste (kg, opcional)</span><input class="input" id="wk-kg" inputmode="decimal" value="${esc(st.kg[st.i])}"></label>` : ''}
      <div class="rest" id="wk-rest" ${st.left > 0 ? '' : 'hidden'}><span class="mini">DESCANSO</span><b class="num" id="wk-left">${mmss(st.left)}</b><button class="link" id="wk-skip">Saltear</button></div>
      <div class="grid2" style="margin-top:auto;padding-top:16px"><button class="btn ghost" id="wk-prev" ${st.i === 0 ? 'disabled' : ''}>← Anterior</button>
        ${st.i < total - 1 ? `<button class="btn" id="wk-next">${next === -1 ? 'Siguiente →' : 'Saltear →'}</button>` : `<button class="btn bib" id="wk-end">🏁 Terminé</button>`}</div>
    </div>`;
    $('#wk-x').onclick = close;
    const kg = $('#wk-kg'); if (kg) kg.oninput = () => { st.kg[st.i] = kg.value; };
    $$('.set').forEach(b => b.onclick = () => {
      const k = +b.dataset.k; sets[k] = !sets[k]; vibrate(20);
      clearInterval(st.timer); st.left = 0;
      if (sets[k] && sets.some(x => !x)){ st.left = restSecs(it.rest); if (st.left) st.timer = setInterval(() => { st.left--; const l = $('#wk-left'); if (l) l.textContent = mmss(st.left); if (st.left <= 0){ clearInterval(st.timer); vibrate([200, 100, 200]); draw(); } }, 1000); }
      if (sets.every(Boolean) && st.i < items.length - 1) setTimeout(() => { if (sets.every(Boolean)){ st.i++; draw(); } }, 600);
      draw();
    });
    const sk = $('#wk-skip'); if (sk) sk.onclick = () => { clearInterval(st.timer); st.left = 0; draw(); };
    const pv = $('#wk-prev'); if (pv) pv.onclick = () => { st.i--; draw(); };
    const nx = $('#wk-next'); if (nx) nx.onclick = () => { st.i++; draw(); };
    const en = $('#wk-end'); if (en) en.onclick = () => {
      clearInterval(st.timer);
      const minutes = Math.max(1, Math.round((Date.now() - st.t0) / 60000));
      const detail = { items: items.map((it, k) => ({ n: it.n, sets: st.done[k].filter(Boolean).length, of: st.done[k].length, kg: st.kg[k] || undefined })) };
      layer.innerHTML = ''; layerInHistory = false; history.back();
      setTimeout(() => proofSheet(t, { minutes, detail }), 120);
    };
  };
  draw();
}

/* ============ Entrenamientos ============ */
// En cancha: cada uno confirma y después el DT toma asistencia. En casa: el DT pone la rutina y cada uno manda la foto como prueba.
const TSTATUS = { voy: ['👍','Va'], no_puedo: ['🙅','No puede'], presente: ['✅','Presente'], ausente: ['❌','Ausente'], hecho: ['✅','Hecho'], rechazado: ['↩️','A rehacer'] };
const trainings = () => (S.TR && S.TR.trainings) || [];
const tlog = (tid, mid) => ((S.TR && S.TR.logs) || []).find(l => l.training_id === tid && l.member_id === mid);
const tWhen = (t) => t.kind === 'cancha' ? t.starts_at : t.due_at;
// ¿Ya pasó? Cancha: dos horas después del inicio. Casa: cuando vence el plazo.
const tPast = (t) => { const w = tWhen(t); if (!w) return false; return Date.now() > new Date(w).getTime() + (t.kind === 'cancha' ? 2*36e5 : 0); };
const tDone = (l) => !!l && (l.status === 'hecho' || l.status === 'presente');
function trainCompliance(mid){
  let done = 0, count = 0;
  trainings().forEach(t => { const l = tlog(t.id, mid); if (tDone(l)){ done++; count++; } else if (tPast(t)) count++; });
  return { done, count };
}
function trainPendingForMe(){
  const me = member(meId()); if (!me || !me.plays) return [];
  return trainings().filter(t => {
    const l = tlog(t.id, meId());
    if (t.kind === 'casa') return !tDone(l) && !(l && l.status === 'no_puedo') && !tPast(t);
    return !tPast(t) && !l;
  }).sort((a,b) => (tWhen(a) ? new Date(tWhen(a)) : Infinity) - (tWhen(b) ? new Date(tWhen(b)) : Infinity));
}
function tProgress(t){
  const pl = players();
  const done = pl.filter(m => tDone(tlog(t.id, m.id))).length;
  return { done, total: pl.length };
}
function trainCard(t){
  const l = tlog(t.id, meId()), pr = tProgress(t), w = tWhen(t);
  const myPill = l ? `<span class="pill ${tDone(l) ? 'ok' : l.status === 'rechazado' || l.status === 'ausente' ? 'coral' : l.status === 'no_puedo' ? '' : 'sky'}">${TSTATUS[l.status][0]} ${TSTATUS[l.status][1]}</span>`
    : !tPast(t) && member(meId()) && member(meId()).plays ? `<span class="pill gold">${t.kind === 'casa' ? 'Pendiente' : 'Confirmá'}</span>` : '';
  return `<button class="card tap" data-train="${t.id}" style="padding:12px 14px">
    <span class="row" style="align-items:flex-start"><span style="font-size:28px;line-height:1">${t.kind === 'casa' ? '🏠' : '🏟️'}</span>

  </button>`;
}

// Achica la foto antes de subirla (las pruebas no necesitan alta resolución).
function compressPhoto(file, max = 900, limit = 250000){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .72, out = c.toDataURL('image/jpeg', q);
      while (out.length > limit && q > .3){ q -= .1; out = c.toDataURL('image/jpeg', q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer esa foto. Probá con otra.')); };
    img.src = url;
  });
}

// Armar la carta: posición, número y 4 atributos. El puntaje general es el promedio.
function cardSheet(id){
  const m = member(id), self = id === meId();
  let pos = (m.positions || [])[0] || null, also = (m.positions || []).slice(1);
  const vals = {}; const sug = suggested(id);
  const allPos = () => pos ? [pos, ...also.filter(x => x !== pos)] : also;
  const at = () => pos === 'ARQ' ? ATTRS_GK : ATTRS;
  const ovOf = () => { const v = at().map(([k]) => vals[k]).filter(x => x != null); return v.length ? Math.round(v.reduce((a,b) => a + b, 0) / v.length) : null; };
  at().forEach(([k]) => { vals[k] = m.attrs && m.attrs[k] != null ? m.attrs[k] : (sug || 65); });
  const el = openSheet(`<h2>${self ? 'Mi carta' : 'Carta de ' + esc(m.name)}</h2>
    <p class="muted">${self && !isDT() ? 'Con criterio, eh: el DT la ve y la puede corregir.' : 'Movés las barras y listo.'}${sug != null ? ` Según sus partidos, la app sugiere <b>${sug}</b>.` : ''}</p>

    <div class="field section"><span>También juega de</span><div class="chips" id="cs-al">${POS.map(([k,l]) => `<button type="button" class="chip ${also.includes(k) && k !== pos ? 'on' : ''}" data-k="${k}" title="${l}">${k}</button>`).join('')}</div><div class="hint">Sirve para que la app sugiera los cambios durante el partido.</div></div>
    <label class="field section"><span>Número de camiseta</span><input class="input" id="cs-n" type="number" inputmode="numeric" min="0" max="99" value="${m.number ?? ''}" style="max-width:120px"></label>
    <div class="stack section" id="cs-a"></div>
    <button class="btn section" id="cs-ok">Guardar carta</button>`);

  const drawA = () => {
    $('#cs-a', el).innerHTML = at().map(([k, l]) => `<label class="field"><span style="display:flex;justify-content:space-between">${l} <b class="num" style="font-size:20px" data-o="${k}">${vals[k]}</b></span><input type="range" class="range" min="40" max="99" value="${vals[k]}" data-k="${k}"></label>`).join('');
    $$('#cs-a input', el).forEach(i => i.oninput = () => { vals[i.dataset.k] = +i.value; $(`[data-o="${i.dataset.k}"]`, el).textContent = i.value; prev(); });
  };
  const drawAlso = () => $$('#cs-al .chip', el).forEach(x => { x.classList.toggle('on', also.includes(x.dataset.k) && x.dataset.k !== pos); x.disabled = x.dataset.k === pos; });
  $$('#cs-al .chip', el).forEach(b => b.onclick = () => { const k = b.dataset.k; also = also.includes(k) ? also.filter(x => x !== k) : [...also, k]; drawAlso(); prev(); });
  drawAlso();
  $$('#cs-p .chip', el).forEach(b => b.onclick = () => { pos = b.dataset.k; also = also.filter(x => x !== pos); drawAlso(); $$('#cs-p .chip', el).forEach(x => x.classList.toggle('on', x === b)); at().forEach(([k]) => { if (vals[k] == null) vals[k] = sug || 65; }); drawA(); prev(); });
  $('#cs-n', el).oninput = prev;
  drawA(); prev();
  $('#cs-ok', el).onclick = async () => {

    try { await rpc('fc_member_save', { ...P(), p_team: S.teamId, p_id: id, p }); closeSheet(); await refresh(); toast('Carta guardada 🃏'); }
    catch(e){ toast(e.message); }
  };
}

function tablaRanking(box){
  const showR = S.T.team.ratings_public || isDT();
  const rows = players().map(m => ({ m, a: agg(m.id) })).filter(o => o.a.pj || o.a.tcount);
  const SORTS = [...(showR ? [['avg','Puntaje']] : []), ['pj','Partidos'], ['goals','Goles'], ['assists','Asistencias'], ['figs','Figura'], ['ent','Entrenos']];
  if (!SORTS.some(s => s[0] === S.sortBy)) S.sortBy = SORTS[0][0];
  const k = S.sortBy;
  const minPj = Math.max(1, Math.ceil(playedMatches().length / 3));
  // Los invitados entran cuando suman en ese ranking (por ejemplo, un gol en la planilla oficial)
  const gst = guests().map(m => ({ m, a: agg(m.id), g: true })).filter(o => ['goals', 'assists', 'figs'].includes(k) ? o.a[k] > 0 : k === 'avg' && o.a.avg != null && o.a.pj >= minPj);
  const list = [...rows, ...gst].filter(o => k === 'ent' ? o.a.tcount > 0 : k === 'avg' ? (o.a.avg != null && o.a.pj >= minPj) : o.a.pj > 0)
    .sort((a,b) => (b.a[k] ?? -1) - (a.a[k] ?? -1) || b.a.pj - a.a.pj || a.m.name.localeCompare(b.m.name));
  const val = (a) => k === 'avg' ? fmt1(a.avg) : k === 'ent' ? `${a.ent}%` : a[k];
  const medal = (i) => ['🥇','🥈','🥉'][i] || `<span class="num" style="font-size:20px;color:var(--muted)">${i+1}</span>`;
  box.innerHTML = `<div class="chips scroll" style="margin-bottom:12px">${SORTS.map(([s,l]) => `<button class="chip ${s === k ? 'on' : ''}" data-s="${s}">${l}</button>`).join('')}</div>
    ${k === 'avg' ? `<p class="tiny muted" style="margin:-4px 0 10px">Promedio de los puntajes del DT. Entran los que jugaron ${plural(minPj,'partido','partidos')} o más.</p>` : ''}
    ${list.length ? `<div class="list">${list.map((o, i) => `<button class="lrow" data-p="${o.m.id}" style="${o.m.id === meId() ? 'border-color:var(--grass)' : ''}"><span style="width:30px;text-align:center;font-size:22px">${medal(i)}</span><span class="av" style="width:34px;height:34px;font-size:13px;background:${avColor(o.m.name)}">${esc(initials(o.m.name))}</span><span class="t"><b>${esc(o.m.name)}</b><small>${o.g ? 'Invitado · ' : ''}${k === 'ent' ? `${o.a.tdone} de ${o.a.tcount} entrenamientos` : `${o.a.pj} PJ · ${o.a.goals} G · ${o.a.assists} A`}</small></span><span class="rate ${k === 'avg' ? rateCls(o.a.avg) : 'r-na'}" style="${k !== 'avg' ? 'color:var(--ink)' : ''}">${val(o.a)}</span></button>`).join('')}</div>`
      : `<div class="card empty muted">Todavía no hay datos para este ranking.</div>`}
    ${!showR ? `<p class="small muted" style="margin-top:12px">🔒 Los puntajes del DT son privados en este equipo: cada uno ve el suyo en Inicio.</p>` : ''}`;
  $$('[data-s]', box).forEach(b => b.onclick = () => { S.sortBy = b.dataset.s; tablaRanking(box); });
  $$('[data-p]', box).forEach(b => b.onclick = () => playerSheet(b.dataset.p));
}
// La vista del Excel: jugadores × partidos.
function tablaPlanilla(box){
  const showR = S.T.team.ratings_public || isDT();
  const ms = playedMatches();
  const byAvg = (a,b) => (b.a.avg ?? -1) - (a.a.avg ?? -1) || b.a.pj - a.a.pj || a.m.name.localeCompare(b.m.name);
  const rows = [...players().map(m => ({ m, a: agg(m.id) })).sort(byAvg), ...guests().map(m => ({ m, a: agg(m.id) })).filter(o => o.a.pj).sort(byAvg)];
  if (!ms.length){ box.innerHTML = `<div class="card empty muted">Cuando haya partidos jugados, acá ves la planilla completa.</div>`; return; }
  const cell = (m, x) => {
    const s = S.T.stats.find(z => z.match_id === x.id && z.member_id === m.id);
    if (!s || !s.played) return '<span class="muted">·</span>';
    const extra = `${s.goals ? '<sup>⚽' + (s.goals > 1 ? s.goals : '') + '</sup>' : ''}`;
    if (s.dt_rating != null && (showR || m.id === meId())) return `<span class="cell ${rateCls(+s.dt_rating)}">${fmt1(+s.dt_rating)}</span>${extra}`;

function rivalText(id){
  const L = LG(), t = lgTeam(id), us = L.standings.find(s => isUs(s.id)), sq = lgSquad(id), me = L.team_ext_id;
  const e = !isUs(id) && lgExpect(us, t);
  const susp = (L.suspended || []).filter(s => s.team_id === id);
  const sc = sq.filter(p => p.g).sort((a,b) => b.g - a.g).slice(0, 4), fg = sq.filter(p => p.fig).sort((a,b) => b.fig - a.fig).slice(0, 2);
  const cd = sq.filter(p => p.am >= 2 || p.ro || p.az).sort((a,b) => (b.ro * 3 + b.az * 2 + b.am) - (a.ro * 3 + a.az * 2 + a.am)).slice(0, 3);
  const ourBy = {}; lgPlayed(me).forEach(m => { const v = lgView(m, me); ourBy[v.oppId] = v; });
  const common = lgPlayed(id).map(m => lgView(m, id)).filter(v => v.oppId !== me && ourBy[v.oppId]).slice(0, 4);
  const lines = [`🔎 *Informe del rival: ${t.name}*`,
    `📊 ${t.pos ? `${t.pos}º · ${t.pts} pts · ` : ''}${t.pg}G ${t.pe}E ${t.pp}P · GF ${t.gf} · GC ${t.gc}`,
    lgForm(id).length ? `📈 Últimos: ${lgForm(id).map(f => ({ G: '🟢', E: '🟡', P: '🔴' }[f.r])).join('')}` : '',
    sc.length ? `⚽ Goleadores: ${sc.map(p => `${shortName(p.n)} ${p.g}`).join(', ')}` : '',
    fg.length ? `⭐ Figuras: ${fg.map(p => `${shortName(p.n)} ${p.fig}`).join(', ')}` : '',
    cd.length ? `🟨 Con tarjetas: ${cd.map(p => `${shortName(p.n)} (${[p.am ? p.am + ' am.' : '', p.az ? p.az + ' az.' : '', p.ro ? p.ro + ' roja' : ''].filter(Boolean).join(', ')})`).join(', ')}` : '',
    susp.length ? `🟥 No juegan: ${susp.map(s => `${shortName(s.name)} (${plural(s.fechas, 'fecha', 'fechas')})`).join(', ')}` : '',
    common.length ? `🆚 Rivales en común: ${common.map(v => `${v.opp} (nosotros ${ourBy[v.oppId].gf}-${ourBy[v.oppId].gc}, ellos ${v.gf}-${v.gc})`).join('; ')}` : '',
    e ? `🔮 Partido esperado: ${S.T.team.name} ${fmt1(e.a)} - ${fmt1(e.b)} · ganar ${pct(e.w)}, empate ${pct(e.d)}, perder ${pct(e.l)}` : ''];
  return lines.filter(Boolean).join('\n');
}

function matchSummaryText(m){
  const sh = m.sheet || { h: [], a: [] };
  const goals = (list) => list.filter(p => p.g).map(p => shortName(p.n) + (p.g > 1 ? ` x${p.g}` : '')).join(', ');
  const cards = [...sh.h.map(p => [p, m.home]), ...sh.a.map(p => [p, m.away])].filter(([p]) => p.am || p.az || p.ro);
  const figs = [...sh.h.filter(p => p.fig).map(p => [p, m.home]), ...sh.a.filter(p => p.fig).map(p => [p, m.away])];
  return [`*${fechaLbl(m.fecha)} · ${m.home} ${m.gh}-${m.ga} ${m.away}*`,
    goals(sh.h) ? `⚽ ${m.home}: ${goals(sh.h)}` : '',
    goals(sh.a) ? `⚽ ${m.away}: ${goals(sh.a)}` : '',
    figs.length ? `⭐ Figura: ${figs.map(([p, t]) => `${shortName(p.n)} (${t})`).join(', ')}` : '',
    cards.length ? `${cards.map(([p, t]) => `${p.ro ? '🟥' : p.az ? '🟦' : '🟨'} ${shortName(p.n)} (${t})`).join(', ')}` : ''].filter(Boolean).join('\n');
}

// Sugiere qué jugador de la planilla oficial es cada uno (por apodo, nombre o iniciales). El DT confirma.
function guessPlayer(m, players){
  const n = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const nick = n(m.name).replace(/[()]/g, ' ').split(/\s+/).filter(Boolean);
  let best = null, bestScore = 0;
  players.forEach(p => {
    const parts = n(p.name).split(/\s+/).filter(Boolean), ini = parts.map(x => x[0]).join('');
    let sc = 0;
    nick.forEach(k => {
      if (k.length >= 2 && ini === k) sc += 3;
      parts.forEach(w => { if (k.length >= 3 && (w.startsWith(k.slice(0, 4)) || k.startsWith(w.slice(0, 4)))) sc += w === parts[0] ? 1 : 2; });
    });
    if (sc > bestScore){ bestScore = sc; best = p; }
  });
  return bestScore >= 2 ? best : null;
}

// Funciona como el grupo de WhatsApp: lista numerada, equipos oscuro y blanco, y alguien que los arma (el que esté).
const SIDE = { oscuro: 'Oscuro', claro: 'Blanco' };
const DAYS_LONG = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const isPicadito = () => S.T && S.T.team.kind === 'amistosos';
const pickups = () => S.PK || [];
const pick = (id) => pickups().find(k => k.id === id);
const currentPickup = () => pickups().find(k => k.status === 'abierta') || pickups().find(k => k.status === 'jugada' && k.finished_at && Date.now() - new Date(k.finished_at) < 48 * 36e5) || null;
const pkGoing = (k) => k.players.filter(p => p.status === 'va').sort((a,b) => new Date(a.joined_at) - new Date(b.joined_at));
const pkName = (id) => (member(id) || {}).name || '¿?';
const pkHour = (iso) => { const d = new Date(iso); return `${d.getHours()}${d.getMinutes() ? ':' + String(d.getMinutes()).padStart(2,'0') : ''}hs`; };
const pkTitle = (k) => k.starts_at ? `Fulbito ${DAYS_LONG[new Date(k.starts_at).getDay()]} ${pkHour(k.starts_at)}` : 'Fulbito';
const mapsUrl = (k) => k.place_url || (k.place ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(k.place)}` : null);
const pkWinner = (k) => k.status !== 'jugada' || k.score_dark == null ? null : k.score_dark > k.score_light ? 'oscuro' : k.score_dark < k.score_light ? 'claro' : 'empate';
function pkMvp(k){
  if (!k.votes.length || (k.finished_at && Date.now() - new Date(k.finished_at) < 48 * 36e5)) return [];
  const c = {}; k.votes.forEach(v => c[v.voted_id] = (c[v.voted_id] || 0) + 1);
  const max = Math.max(...Object.values(c)); return Object.keys(c).filter(x => c[x] === max);
}
// Estadísticas de cada uno en los picados jugados
function pkStats(mid){
  let pj = 0, g = 0, e = 0, p = 0, goles = 0, figs = 0;
  pickups().filter(k => k.status === 'jugada').forEach(k => {
    const me = k.players.find(x => x.member_id === mid && x.status === 'va' && x.side);
    goles += k.goals.filter(x => x.member_id === mid).length;
    if (pkMvp(k).includes(mid)) figs++;
    if (!me) return; pj++;
    const w = pkWinner(k); if (w === 'empate') e++; else if (w === me.side) g++; else if (w) p++;
  });
  return { pj, g, e, p, goles, figs, pct: pj ? Math.round((g + e * .5) / pj * 100) : null };
}
function nextUsualDate(){
  const t = S.T.team, d = new Date(), day = t.usual_day ?? 4, [hh, mm] = (t.usual_time || '19:00').split(':').map(Number);
  d.setHours(hh || 19, mm || 0, 0, 0);
  let add = (day - d.getDay() + 7) % 7; if (add === 0 && d < new Date()) add = 7;
  d.setDate(d.getDate() + add); return d;
}

async function pkCall(fn, args, msg){
  try { await rpc(fn, { ...P(), ...args }); vibrate(15); await pkRefresh(); if (msg) toast(msg); return true; }
  catch(e){ toast(e.code ? e.message : 'Todavía no anda: falta pegar el SQL del picadito en Supabase.', 3500); return false; }
}

function pkRow(k, p, n){
  const m = member(p.member_id) || { name: '¿?' };

}
function pkListText(k){
  const going = pkGoing(k);
  return `${k.place ? `*se juega en ${k.place}*\n` : ''}${pkTitle(k)}\n${going.slice(0, k.capacity).map((p, i) => `${i + 1}. ${pkName(p.member_id)}`).join('\n')}${going.length > k.capacity ? `\n\nEn espera:\n${going.slice(k.capacity).map(p => pkName(p.member_id)).join('\n')}` : ''}\n\nSumate en La Casaca: ${BASE}`;

function pkTeamsText(k){

  return `*oscuro*\n${s('oscuro')}\n\n*blanco*\n${s('claro')}`;
}

// Armar equipos: parejos automático (según la carta y cuánto gana cada uno) o a mano.
function pkPower(mid){ const m = member(mid) || {}, s = pkStats(mid); return (m.overall ?? 65) + (s.pj >= 3 ? (s.pct - 50) / 5 : 0); }
function balanceSides(ids){
  const gk = ids.filter(id => ((member(id) || {}).positions || [])[0] === 'ARQ'), rest = ids.filter(id => !gk.includes(id)).sort((a,b) => pkPower(b) - pkPower(a));
  const out = {}, tot = { oscuro: 0, claro: 0 }, cnt = { oscuro: 0, claro: 0 };
  [...gk, ...rest].forEach(id => { const s = cnt.oscuro < cnt.claro ? 'oscuro' : cnt.claro < cnt.oscuro ? 'claro' : tot.oscuro <= tot.claro ? 'oscuro' : 'claro'; out[id] = s; tot[s] += pkPower(id); cnt[s]++; });
  return out;
}
function teamsSheet2(k){
  const ids = pkGoing(k).slice(0, k.capacity).map(p => p.member_id);
  const sides = {}; pkGoing(k).forEach(p => { if (ids.includes(p.member_id)) sides[p.member_id] = p.side || null; });
  const el = openSheet(`<h2>Armar equipos</h2><p class="muted">Tocá a cada uno para pasarlo de equipo, o pedí que la app los arme parejos.</p>
    <button class="btn sky section" id="ts-auto">⚖️ Armar parejos automático</button>
    <div class="grid2 section" id="ts-g" style="align-items:start"></div>
    <button class="btn section" id="ts-ok">Guardar equipos</button>`);
  const draw = () => {
    const col = (s) => `<div class="card" style="padding:10px"><div class="mini" style="margin-bottom:6px">${s === 'oscuro' ? '⚫ OSCURO' : s === 'claro' ? '⚪ BLANCO' : 'SIN EQUIPO'} (${ids.filter(id => sides[id] === s).length})</div>${ids.filter(id => sides[id] === s).map(id => `<button class="chip" data-t="${id}" style="width:100%;margin-bottom:6px;justify-content:space-between">${esc(pkName(id))}<span class="mini">${Math.round(pkPower(id))}</span></button>`).join('')}</div>`;
    $('#ts-g', el).innerHTML = col('oscuro') + col('claro') + (ids.some(id => !sides[id]) ? `<div style="grid-column:1/-1">${col(null)}</div>` : '');
    $$('[data-t]', el).forEach(b => b.onclick = () => { const id = b.dataset.t; sides[id] = sides[id] === 'oscuro' ? 'claro' : sides[id] === 'claro' ? null : 'oscuro'; draw(); });
  };
  draw();
  $('#ts-auto', el).onclick = () => { Object.assign(sides, balanceSides(ids)); draw(); toast('Equipos parejos. Retocá si querés.'); };
  $('#ts-ok', el).onclick = async () => { closeSheet(); if (await pkCall('fc_pickup_sides', { p_pickup: k.id, p_sides: sides }, 'Equipos listos ⚽')) { (await copy(pkTeamsText(pick(k.id)))) && toast('Equipos listos y copiados para el grupo 📋', 3000); } };
}

function renderTablaPicadito(){
  const rows = activeMembers().map(m => ({ m, s: pkStats(m.id) })).filter(o => o.s.pj);
  const minPj = Math.max(1, Math.ceil(pickups().filter(k => k.status === 'jugada').length / 4));
  const k = ['pct','goles','pj','figs'].includes(S.pkSort) ? S.pkSort : 'pct';
  const list = rows.filter(o => k !== 'pct' || o.s.pj >= minPj).sort((a,b) => (b.s[k] ?? -1) - (a.s[k] ?? -1) || b.s.pj - a.s.pj);
  // Duplas: cuando juegan del mismo lado, ¿cuánto ganan?
  const pairs = {};
  pickups().filter(x => x.status === 'jugada' && pkWinner(x)).forEach(x => ['oscuro','claro'].forEach(sd => {
    const ids = x.players.filter(p => p.status === 'va' && p.side === sd).map(p => p.member_id).sort(), w = pkWinner(x);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){ const key = ids[i] + '|' + ids[j]; pairs[key] = pairs[key] || { n: 0, pts: 0 }; pairs[key].n++; pairs[key].pts += w === sd ? 1 : w === 'empate' ? .5 : 0; }
  }));
  const pr = Object.entries(pairs).filter(([,v]) => v.n >= 3).map(([key, v]) => ({ ids: key.split('|'), n: v.n, pct: Math.round(v.pts / v.n * 100) }));
  const best = pr.slice().sort((a,b) => b.pct - a.pct || b.n - a.n).slice(0, 5), worst = pr.slice().sort((a,b) => a.pct - b.pct || b.n - a.n).slice(0, 3);

  $('#main').innerHTML = `<h1 style="margin-bottom:12px">Tabla</h1>
    <div class="chips scroll" style="margin-bottom:12px">${[['pct','% victorias'],['goles','Goles'],['pj','Picados'],['figs','Figura']].map(([s,l]) => `<button class="chip ${s === k ? 'on' : ''}" data-s="${s}">${l}</button>`).join('')}</div>
    ${list.length ? `<div class="list">${list.map((o, i) => `<button class="lrow" data-p="${o.m.id}" style="${o.m.id === meId() ? 'border-color:var(--grass)' : ''}"><span style="width:28px;text-align:center;font-size:20px">${['🥇','🥈','🥉'][i] || `<span class="mini">${i + 1}</span>`}</span><span class="t"><b>${esc(o.m.name)}</b><small>${o.s.pj} PJ · ${o.s.g}G ${o.s.e}E ${o.s.p}P · ⚽ ${o.s.goles}</small></span><span class="rate ${k === 'pct' ? (o.s.pct >= 60 ? 'r-hi' : o.s.pct >= 45 ? 'r-ok' : 'r-lo') : 'r-na'}" style="${k !== 'pct' ? 'color:var(--ink)' : ''}">${k === 'pct' ? o.s.pct + '%' : o.s[k]}</span></button>`).join('')}</div>${k === 'pct' ? `<p class="tiny muted" style="margin-top:6px">Entran los que jugaron ${plural(minPj, 'picado', 'picados')} o más. El empate cuenta medio.</p>` : ''}`
      : '<div class="card empty muted">Cuando carguen resultados de los picados, acá aparece quién gana más.</div>'}
    <div class="section"><div class="section-title"><h2>🔥 Duplas que ganan</h2></div>${best.length ? `<div class="list">${best.map(x => `<div class="lrow" style="padding:10px 12px"><span class="t"><b>${esc(pkName(x.ids[0]))} + ${esc(pkName(x.ids[1]))}</b><small>Juntos: ${plural(x.n, 'picado', 'picados')}</small></span><span class="rate r-hi" style="font-size:18px">${x.pct}%</span></div>`).join('')}</div>` : '<p class="small muted">Aparecen cuando dos jugaron juntos 3 veces o más.</p>'}</div>
    ${worst.length ? `<div class="section"><div class="section-title"><h2>🧊 Duplas que no se entienden</h2></div><div class="list">${worst.map(x => `<div class="lrow" style="padding:10px 12px"><span class="t"><b>${esc(pkName(x.ids[0]))} + ${esc(pkName(x.ids[1]))}</b><small>Juntos: ${plural(x.n, 'picado', 'picados')}</small></span><span class="rate r-lo" style="font-size:18px">${x.pct}%</span></div>`).join('')}</div></div>` : ''}
    ${mine.length ? `<div class="section"><div class="section-title"><h2>Con quién ganás más</h2></div><div class="list">${mine.slice(0, 5).map(x => { const o = x.ids.find(i => i !== meId()); return `<div class="lrow" style="padding:10px 12px"><span class="t"><b>${esc(pkName(o))}</b><small>Juntos: ${plural(x.n, 'picado', 'picados')}</small></span><span class="rate ${x.pct >= 50 ? 'r-ok' : 'r-lo'}" style="font-size:18px">${x.pct}%</span></div>`; }).join('')}</div></div>` : ''}`;
  $$('[data-s]').forEach(b => b.onclick = () => { S.pkSort = b.dataset.s; renderTablaPicadito(); });
  $$('[data-p]').forEach(b => b.onclick = () => playerSheet(b.dataset.p));
}

// Notificaciones push: convocatoria corta a 2 días, entrenamientos del DT, quién ya entrenó y cargar el partido.
const VAPID = 'BNI5NZVkLJbDX8l1e32yE__SU_NzbJMWF0tBVc5eAoB7K0VU84HXuraEqiGI37FrwWz8tzD9_jNg1-YRJwjHeoE';
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const b64u = (x) => Uint8Array.from(atob((x + '='.repeat((4 - x.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function pushSub(){ const reg = await navigator.serviceWorker.getRegistration(); return reg && reg.pushManager.getSubscription(); }
async function pushState(){
  if (!pushOK()) return isIOS && !standalone() ? 'ios' : 'no';
  if (Notification.permission === 'denied') return 'denied';
  try { return Notification.permission === 'granted' && await pushSub() ? 'on' : 'off'; } catch(e){ return 'off'; }
}
const pushSave = (sub) => { const j = sub.toJSON(); return rpc('fc_push_subscribe', { ...P(), p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth }); };
// Al entrar: averigua el estado y, si ya estaba activado, vuelve a anotar el celu a esta cuenta.
async function pushCheck(){
  if (S.demo){ S.push = 'no'; return; }
  S.push = await pushState();
  if (S.push === 'on') pushSub().then(s => s && pushSave(s)).catch(() => {});
}
async function pushEnable(){
  try {
    if (await Notification.requestPermission() !== 'granted'){ S.push = await pushState(); toast('Sin permiso no te puede avisar. Activalo en los ajustes del celu.', 4000); render(); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
    await pushSave(sub);
    S.push = 'on'; toast('🔔 Listo: te va a llegar un aviso de prueba');
    fetch(`${SB_URL}/functions/v1/casaca-push`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ test_token: S.token }) }).catch(() => {});
  } catch(e){ toast('No se pudieron activar los avisos en este celu.', 3500); }
  render();
}
async function pushDisable(){
  try { const sub = await pushSub(); if (sub){ await rpc('fc_push_unsubscribe', { ...P(), p_endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); } } catch(e){}
  S.push = 'off'; toast('Avisos apagados'); render();
}
function pushCardHTML(){
  if (LS.get('casaca_push_no') || !['off', 'ios'].includes(S.push)) return '';
  return S.push === 'ios'
    ? `<div class="card section"><h3>📲 Instalá la app para recibir avisos</h3><p class="muted small" style="margin:4px 0 10px">En iPhone los avisos llegan solo con la app instalada: tocá <b>Compartir</b> ⬆️ abajo y después <b>Agregar a inicio</b>. Abrila desde ese ícono y activá los avisos.</p><button class="link muted" id="ps-no">Entendido</button></div>`

}

  $$('#st-cm button', el).forEach(b => b.onclick = () => { cm = b.dataset.k; $$('#st-cm button', el).forEach(x => x.classList.toggle('on', x === b)); });
  $$('#st-p button', el).forEach(b => b.onclick = () => { pub = b.dataset.v === '1'; $$('#st-p button', el).forEach(x => x.classList.toggle('on', x === b)); });
  const save = async (p, msg) => { try { await rpc('fc_team_settings', { ...P(), p_team: S.teamId, p }); closeSheet(); await loadMe(); await refresh(); toast(msg); } catch(e){ toast(e.message); } };
  $('#st', el).onsubmit = (e) => { e.preventDefault(); if (size !== t.players_on_field) PZ = null; save({ name: $('#st-n', el).value.trim(), emoji: $('#st-e', el).value.trim(), category: $('#st-c', el).value.trim(), players_on_field: size, ratings_public: pub, card_mode: cm, min_players: stepVal(el, 'st-min'), board_suggest: bs,
    kind, ...(kind === 'amistosos' ? { place: $('#st-pl', el).value.trim(), place_url: $('#st-pu', el).value.trim(), usual_day: day, usual_time: $('#st-h', el).value, usual_size: $('#st-cu', el).value, price: $('#st-pr', el).value, alias: $('#st-al', el).value.trim() } : {}) }, 'Ajustes guardados'); };
  $('#st-nc', el).onclick = () => save({ new_code: true }, 'Código de jugadores nuevo');
  $('#st-nd', el).onclick = () => save({ new_dt_code: true }, 'Código de DT nuevo');
}

/* ============ Listo ============ */
window.addEventListener('online', () => { if (S.T) refresh(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.T && !$('#layer').innerHTML) refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
